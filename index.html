<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#282544"><title>안산지사 BIXPO T/F</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f5f6fb;color:#25253b}header{background:#282544;color:#fff;padding:22px 18px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#bbb9d2;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:18px}.hero,.card{background:#fff;border:1px solid #e6e7ef;border-radius:16px;padding:18px;margin-bottom:15px}.hero{background:linear-gradient(120deg,#eeeaff,#eef5ff)}.hero h2{margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#fff;border:1px solid #e7e8f0;border-radius:14px;padding:15px}.metric b{font-size:25px;display:block;color:#6654dc}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tabs button,.btn{border:0;border-radius:10px;padding:11px 14px;background:#fff;color:#555;border:1px solid #e2e3eb;font-weight:650;white-space:nowrap}.tabs button.on,.btn.primary{background:#6654dc;color:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}h3{margin:0 0 13px}.item{border-top:1px solid #eee;padding:13px 0}.item:first-of-type{border-top:0}.badge{display:inline-block;background:#f0edff;color:#6654dc;border-radius:20px;padding:3px 8px;font-size:11px}.muted{color:#7c8193;font-size:12px}input,select,textarea{width:100%;padding:10px;border:1px solid #dfe1e9;border-radius:9px;font:inherit}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form .wide{grid-column:1/-1}dialog{border:0;border-radius:16px;width:min(620px,92vw);padding:20px;box-shadow:0 20px 60px #0003}dialog::backdrop{background:#1e1e3377}.warn{background:#fff5e2;color:#8c6214;padding:10px;border-radius:10px;margin-top:8px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}header h1{font-size:21px}.wrap{padding:12px}}</style></head><body>
<header><h1>안산지사 BIXPO T/F</h1><p>BIXPO 2026 전시 준비 · 출장 · 근무 통합관리</p></header><div class="wrap">
<div class="hero"><h2>BIXPO 2026</h2><div class="muted">전시 2026.11.04(수) ~ 11.06(금) · 사전 부스 준비 11.03(화)</div><div class="warn">현재 계획: 최재혁 — 11/2(월) 오후 출발 · 직원 1명 — 11/2(월) 오후 KTX 출발 · 11/3(화) 공동 부스 준비</div></div>
<div class="grid" id="metrics"></div><div class="tabs" id="tabs"></div><main id="view"></main></div>
<dialog id="dlg"><form method="dialog" id="form"><h3 id="ft"></h3><div id="fields" class="form"></div><div class="row" style="justify-content:flex-end;margin-top:15px"><button class="btn" value="cancel">취소</button><button class="btn primary" id="save" value="default">저장</button></div></form></dialog>
<script>
const K='bixpo2026_tf_v1',seed={people:[{id:'p1',name:'최재혁',role:'T/F',down:'11/2(월) 오후 출발',up:'미정',stay:'미정',note:'11/3 직원 1명과 전시부스 준비'},{id:'p2',name:'직원 1',role:'부스 준비',down:'11/2(월) 오후 KTX 출발',up:'미정',stay:'미정',note:'11/3 최재혁과 전시부스 준비'}],shifts:[['11/4(수)','오전','미배정'],['11/4(수)','오후','미배정'],['11/5(목)','오전','미배정'],['11/5(목)','오후','미배정'],['11/6(금)','오전','미배정'],['11/6(금)','오후','미배정']].map((x,i)=>({id:'s'+i,date:x[0],period:x[1],people:x[2],time:'',note:''})),tasks:[{id:'t1',title:'전시부스 설치 및 시연환경 점검',owner:'최재혁, 직원 1',due:'11/3(화)',done:false,note:'Power TBM / Safety 4-Cut 시연 준비'},{id:'t2',title:'시연용 기기·충전기·케이블 준비',owner:'미정',due:'11/3(화)',done:false,note:''},{id:'t3',title:'오프라인 대체 시연자료 준비',owner:'미정',due:'11/3(화)',done:false,note:'인터넷 장애 대비'}],notes:[]};let S;try{S=JSON.parse(localStorage.getItem(K))||seed}catch(e){S=seed}const save=()=>localStorage.setItem(K,JSON.stringify(S));let tab='home';const T=[['home','오늘 현황'],['people','인원·출장'],['shifts','전시 근무표'],['tasks','준비·시연'],['notes','공지·기록'],['backup','백업']];
function metrics(){let d=S.tasks.filter(x=>x.done).length;return [['참여 인원',S.people.length+'명'],['근무 미배정',S.shifts.filter(x=>x.people==='미배정'||!x.people).length+'칸'],['준비 완료',d+'/'+S.tasks.length],['숙박 미정',S.people.filter(x=>x.stay==='미정'||!x.stay).length+'명']].map(x=>'<div class="metric"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}
function render(){document.querySelector('#metrics').innerHTML=metrics();document.querySelector('#tabs').innerHTML=T.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>').join('');let h='';
if(tab==='home')h='<div class="card"><h3>핵심 일정</h3><div class="item"><b>11월 2일(월) 오후</b><div class="muted">최재혁 출발 · 직원 1 KTX 출발</div></div><div class="item"><b>11월 3일(화)</b><div class="muted">최재혁 + 직원 1 전시부스 준비</div></div><div class="item"><b>11월 4~6일</b><div class="muted">BIXPO 전시 운영</div></div></div><div class="card"><h3>확인 필요</h3><div class="warn">KTX 정확한 시간·열차번호·좌석, 숙소 체크인/체크아웃, 상행 일정, 전시 근무자 배정이 아직 필요합니다.</div></div>';
if(tab==='people')h='<div class="card"><div class="row between"><h3>인원·출장</h3><button class="btn primary" onclick="person()">+ 인원 추가</button></div>'+S.people.map((p,i)=>'<div class="item"><div class="row between"><b>'+p.name+' <span class="badge">'+p.role+'</span></b><button class="btn" onclick="person('+i+')">수정</button></div><div class="muted">하행 '+p.down+' · 상행 '+p.up+' · 숙박 '+p.stay+'</div><div>'+p.note+'</div></div>').join('')+'</div>';
if(tab==='shifts')h='<div class="card"><h3>전시안내 근무표</h3>'+S.shifts.map((s,i)=>'<div class="item row between"><div><b>'+s.date+' '+s.period+'</b><div class="muted">'+(s.time||'시간 미정')+' · '+s.people+(s.note?' · '+s.note:'')+'</div></div><button class="btn" onclick="shift('+i+')">배정</button></div>').join('')+'</div>';
if(tab==='tasks')h='<div class="card"><div class="row between"><h3>준비·시연 체크리스트</h3><button class="btn primary" onclick="task()">+ 추가</button></div>'+S.tasks.map((t,i)=>'<div class="item"><div class="row"><input style="width:20px" type="checkbox" '+(t.done?'checked':'')+' onchange="S.tasks['+i+'].done=this.checked;save();render()"><b>'+t.title+'</b><button class="btn" style="margin-left:auto" onclick="task('+i+')">수정</button></div><div class="muted">담당 '+t.owner+' · 마감 '+t.due+'</div><div>'+t.note+'</div></div>').join('')+'</div>';
if(tab==='notes')h='<div class="card"><div class="row between"><h3>공지·인수인계</h3><button class="btn primary" onclick="note()">+ 기록</button></div>'+(S.notes.length?S.notes.map((n,i)=>'<div class="item"><b>'+n.title+'</b><div class="muted">'+n.date+'</div><div>'+n.text+'</div></div>').join(''):'<div class="muted">아직 기록이 없습니다.</div>')+'</div>';
if(tab==='backup')h='<div class="card"><h3>백업</h3><p class="muted">현재 자료는 이 기기의 브라우저에 저장됩니다. 중요한 변경 후 JSON 백업을 권장합니다.</p><div class="row" style="margin-top:15px"><button class="btn primary" onclick="backup()">백업 다운로드</button><label class="btn">백업 복원<input type="file" accept=".json" hidden onchange="restore(this)"></label></div></div>';
document.querySelector('#view').innerHTML=h}
function modal(title,fields,cb){ft.textContent=title;document.querySelector('#fields').innerHTML=fields;dlg.showModal();document.querySelector('#form').onsubmit=e=>{if(e.submitter&&e.submitter.value==='cancel')return; e.preventDefault();cb(new FormData(e.target));save();dlg.close();render()}}
const inp=(n,l,v='')=>'<label>'+l+'<input name="'+n+'" value="'+String(v).replaceAll('"','&quot;')+'"></label>';
function person(i){let p=i===undefined?{name:'',role:'',down:'',up:'',stay:'',note:''}:S.people[i];modal(i===undefined?'인원 추가':'인원 수정',inp('name','이름',p.name)+inp('role','역할',p.role)+inp('down','KTX/하행 일정',p.down)+inp('up','상행 일정',p.up)+inp('stay','숙박',p.stay)+inp('note','메모',p.note),f=>{let x=Object.fromEntries(f);if(i===undefined){x.id='p'+Date.now();S.people.push(x)}else Object.assign(S.people[i],x)})}
function shift(i){let s=S.shifts[i];modal('근무 배정 — '+s.date+' '+s.period,inp('people','근무자',s.people)+inp('time','근무시간',s.time)+inp('note','메모',s.note),f=>Object.assign(s,Object.fromEntries(f)))}
function task(i){let t=i===undefined?{title:'',owner:'',due:'',note:'',done:false}:S.tasks[i];modal(i===undefined?'준비물 추가':'준비물 수정',inp('title','준비할 것',t.title)+inp('owner','담당자',t.owner)+inp('due','마감일',t.due)+inp('note','메모',t.note),f=>{let x=Object.fromEntries(f);if(i===undefined){x.id='t'+Date.now();x.done=false;S.tasks.push(x)}else Object.assign(S.tasks[i],x)})}
function note(){modal('공지·인수인계 기록',inp('title','제목')+inp('date','날짜',new Date().toLocaleDateString('ko-KR'))+inp('text','내용'),f=>{let x=Object.fromEntries(f);x.id='n'+Date.now();S.notes.unshift(x)})}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='BIXPO_TF_backup.json';a.click()}
function restore(el){let r=new FileReader;r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('복원했습니다.')}catch(e){alert('올바른 백업 파일이 아닙니다.')}};r.readAsText(el.files[0])}render();
</script></body></html>
