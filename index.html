<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#282544"><title>안산지사 BIXPO T/F</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f5f6fb;color:#25253b}header{background:#282544;color:white;padding:20px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#c9c7db}.wrap{max-width:1180px;margin:auto;padding:15px}.hero,.card{background:#fff;border:1px solid #e5e6ef;border-radius:16px;padding:16px;margin-bottom:14px}.hero{background:linear-gradient(120deg,#eeeaff,#edf5ff)}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tabs button{border:1px solid #e1e2ea;background:#fff;border-radius:10px;padding:10px 13px;font-weight:700;white-space:nowrap}.tabs .on{background:#6555d9;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:#fff;border:1px solid #e5e6ee;border-radius:13px;padding:13px}.metric b{display:block;font-size:23px;color:#6555d9;margin-top:3px}.muted{font-size:12px;color:#777c90}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.filter{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0}.filter select{padding:8px 12px;border:1px solid #dfe1e9;border-radius:9px;background:#fff;font-weight:700}.groups{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.group{border-radius:12px;padding:12px;min-height:100px}.group h4{margin:0 0 8px;font-size:13px}.group .ev{background:#fff8;margin:5px 0}.daygroup{margin:6px 0;padding:3px;border-radius:9px}.daygroup.depart{background:#e8f3ff}.daygroup.stay{background:#f2ebff}.daygroup.shift{background:#e8f8ef}.daygroup.prep{background:#fff1df}.daygroup.return{background:#ffe9ec}.daygroup .ev{margin:2px 0}.dow{text-align:center;font-size:12px;color:#7a7f91;padding:5px}.day{min-height:150px;background:#fff;border:1px solid #e4e5ed;border-radius:12px;padding:9px}.day.off{opacity:.35}.day.eventday{border-color:#c7bfff}.num{font-weight:800;margin-bottom:6px}.ev{font-size:11px;border-radius:7px;padding:5px 6px;margin:4px 0;line-height:1.35}.depart{background:#e8f3ff;color:#235d8f}.stay{background:#f2ebff;color:#6544a1}.shift{background:#e8f8ef;color:#23734a}.prep{background:#fff1df;color:#8b5b17}.return{background:#ffe9ec;color:#9b3c4a}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.legend span{font-size:11px;padding:5px 8px;border-radius:12px}.item{padding:12px 0;border-top:1px solid #eee}.item:first-of-type{border:0}.badge{background:#efedff;color:#6555d9;border-radius:15px;padding:3px 7px;font-size:11px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.sync{font-size:11px;color:#26714b;background:#e9f8ef;padding:5px 8px;border-radius:15px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.groups{grid-template-columns:1fr 1fr}.cal{grid-template-columns:1fr}.dow{display:none}.day,.day.off{min-height:auto;opacity:1}.day.off{display:none}.wrap{padding:10px}header h1{font-size:21px}}button.admin{background:#6555d9;color:#fff;border:0;border-radius:9px;padding:9px 12px;font-weight:700}.edit{font-size:11px;border:1px solid #ddd;border-radius:8px;padding:5px 8px;background:#fff}.loginbox{display:flex;gap:6px}.loginbox input{width:150px;padding:8px;border:1px solid #ddd;border-radius:8px}.notice{background:#fff8dc;border:1px solid #f0d77b;border-radius:14px;padding:14px 16px;margin-bottom:14px}.notice h3{margin:0 0 5px;color:#745600}.notice p{margin:0;white-space:pre-wrap}.notice-actions{margin-top:8px}</style></head><body>
<header><div class="row between"><div><h1>안산지사 BIXPO T/F</h1><p>BIXPO 2026 출장 · 숙박 · 전시근무 통합 일정</p></div><div class="row"><span class="sync">● 실시간 공유</span><button class="admin" id="adminBtn" onclick="adminLogin()">관리자 로그인</button></div></div></header><div class="wrap"><div class="hero"><b>BIXPO 2026</b><div class="muted">11월 4일 ~ 6일 · 사전 부스 준비 11월 3일</div></div><div id="noticeArea"></div><div id="metrics" class="grid"></div><div class="tabs" id="tabs"></div><main id="view"></main></div>
<script>
const SB='https://ovaqwpzffawtozgidbav.supabase.co',KEY='sb_publishable_WJNbTVKF66c6Y7AVfxaYBA_7gpkEUyP';let S={people:[],shifts:[],tasks:[],notes:[]},tab='calendar',admin=false,adminPass='',personFilter='전체',typeFilter='전체';const T=[['calendar','📅 통합 달력'],['people','👥 개인별 일정'],['shifts','🪪 근무표'],['tasks','☑ 준비·시연']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(s){let m=String(s||'').match(/11\/(\d{1,2})/);return m?+m[1]:null}
function stayRange(s){let a=[...String(s||'').matchAll(/11\/(\d{1,2})/g)].map(x=>+x[1]);return a.length>1?[a[0],a[1]]:null}
function selected(name){return personFilter==='전체'||String(name||'').replaceAll(' ','').split(',').includes(personFilter)}
function typed(t){return typeFilter==='전체'||typeFilter===t||(typeFilter==='travel'&&(t==='depart'||t==='return'))}
function events(d){let a=[];S.people.forEach(p=>{if(!selected(p.name))return;if(typed('depart')&&md(p.down)===d)a.push(['depart','↓ '+p.name+' 출발 · '+p.down]);if(typed('return')&&md(p.up)===d)a.push(['return','↑ '+p.name+' 복귀 · '+p.up]);let r=stayRange(p.stay);if(typed('stay')&&r&&d>=r[0]&&d<r[1])a.push(['stay','⌂ '+p.name+' 숙박'])});S.shifts.forEach(s=>{let names=String(s.people||'').replaceAll(' ','').split(',');if(typed('shift')&&md(s.date)===d&&(personFilter==='전체'||names.includes(personFilter)))a.push(['shift','● '+s.period+' '+s.time+' · '+s.people])});if(typed('prep')&&d===3&&(personFilter==='전체'||['최재혁','정승훈'].includes(personFilter)))a.push(['prep','◆ 부스 준비 · 최재혁, 정승훈']);return a}
function metrics(){let stays=S.people.filter(p=>stayRange(p.stay)).length;return [['참여 인원',S.people.length+'명'],['숙박 확정',stays+'명'],['근무 배정',S.shifts.filter(s=>s.people&&s.people!=='미배정').length+'/'+S.shifts.length],['준비 완료',S.tasks.filter(t=>t.done).length+'/'+S.tasks.length]].map(x=>'<div class="metric"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}
function calendar(){let h='<div class="card"><div class="row between"><h3>2026년 11월 1주차</h3><span class="muted">11월 1일(일) ~ 7일(토)</span></div><div class="filter"><b>내 일정 보기</b><select onchange="personFilter=this.value;render()"><option>전체</option>'+S.people.map(p=>'<option '+(personFilter===p.name?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select><b>일정 종류</b><select onchange="typeFilter=this.value;render()"><option value="전체">전체</option><option value="travel" '+(typeFilter==='travel'?'selected':'')+'>출발·복귀</option><option value="stay" '+(typeFilter==='stay'?'selected':'')+'>숙박</option><option value="shift" '+(typeFilter==='shift'?'selected':'')+'>전시근무</option><option value="prep" '+(typeFilter==='prep'?'selected':'')+'>부스준비</option></select><span class="muted">이름과 일정 종류를 함께 선택할 수 있습니다.</span></div><div class="legend"><span class="depart">↓ 출발</span><span class="stay">⌂ 숙박</span><span class="shift">● 전시근무</span><span class="prep">◆ 부스준비</span><span class="return">↑ 복귀</span></div><div class="cal">'+['1 일','2 월','3 화','4 수','5 목','6 금','7 토'].map((x,i)=>{let es=events(i+1),order=['depart','stay','shift','prep','return'];es.sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));return '<div class="day '+(es.length?'eventday':'')+'"><div class="num">'+x+'</div>'+order.map(type=>{let rows=es.filter(e=>e[0]===type);return rows.length?'<div class="daygroup '+type+'">'+rows.map(e=>'<div class="ev '+type+'">'+esc(e[1])+'</div>').join('')+'</div>':''}).join('')+'</div>'}).join('')+'</div></div>';return h}
function renderNotice(){let n=(S.notes||[])[0];let h='';if(n&&n.text)h='<div class="notice"><h3>📢 '+esc(n.title||'공지사항')+'</h3><p>'+esc(n.text)+'</p></div>';if(admin)h+='<div class="notice-actions"><button class="admin" onclick="editNotice()">📢 공지사항 '+(n&&n.text?'수정':'등록')+'</button></div>';document.querySelector('#noticeArea').innerHTML=h}
function editNotice(){let n=(S.notes||[])[0]||{title:'공지사항',text:''};let title=prompt('공지 제목',n.title||'공지사항');if(title===null)return;let text=prompt('공지 내용',n.text||'');if(text===null)return;if(!S.notes)S.notes=[];if(text.trim())S.notes=[{id:n.id||'notice-main',title,text,date:new Date().toLocaleDateString('ko-KR')}];else S.notes=[];persist()}
function render(){renderNotice();metricsEl=document.querySelector('#metrics');metricsEl.innerHTML=metrics();document.querySelector('#tabs').innerHTML=T.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>').join('');let h='';
if(tab==='calendar')h=calendar();
if(tab==='people')h='<div class="card"><div class="row between"><h3>개인별 출장 일정</h3>'+(admin?'<button class="admin" onclick="addPerson()">+ 인원 추가</button>':'')+'</div>'+S.people.map((p,i)=>'<div class="item"><div class="row between"><div><b>'+esc(p.name)+'</b> <span class="badge">'+esc(p.role)+'</span></div>'+(admin?'<button class="edit" onclick="editPerson('+i+')">수정</button>':'')+'</div><div>↓ '+esc(p.down)+'</div><div>⌂ '+esc(p.stay)+'</div><div>↑ '+esc(p.up)+'</div>'+(p.note?'<div class="muted">'+esc(p.note)+'</div>':'')+'</div>').join('')+'</div>';
if(tab==='shifts')h='<div class="card"><h3>전시안내 근무표</h3>'+S.shifts.map((s,i)=>'<div class="item row between"><div><b>'+esc(s.date)+' '+esc(s.period)+' '+esc(s.time)+'</b><div>'+esc(s.people)+'</div></div>'+(admin?'<button class="edit" onclick="editShift('+i+')">수정</button>':'')+'</div>').join('')+'</div>';
if(tab==='tasks')h='<div class="card"><h3>준비·시연</h3>'+S.tasks.map((t,i)=>'<div class="item row between"><div><b>'+(t.done?'✓ ':'○ ')+esc(t.title)+'</b><div class="muted">담당 '+esc(t.owner)+' · '+esc(t.due)+'</div><div>'+esc(t.note)+'</div></div>'+(admin?'<button class="edit" onclick="editTask('+i+')">수정</button>':'')+'</div>').join('')+'</div>';
document.querySelector('#view').innerHTML=h}
async function api(action,data){let r;try{r=await fetch(SB+'/functions/v1/bixpo-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,password:adminPass,data})})}catch(e){let x=new Error('network');x.kind='network';throw x}let body={};try{body=await r.json()}catch(e){}if(r.status===401||r.status===403){let x=new Error('auth');x.kind='auth';throw x}if(!r.ok){let x=new Error(body.detail||body.error||('HTTP '+r.status));x.kind='db';x.status=r.status;throw x}return body}
async function adminLogin(){if(admin){admin=false;adminPass='';adminBtn.textContent='관리자 로그인';render();return}let p=prompt('관리자 비밀번호를 입력하세요.');if(!p)return;adminPass=p;try{await api('login');admin=true;adminBtn.textContent='관리자 로그아웃';render()}catch(e){adminPass='';if(e.kind==='network')alert('네트워크 오류입니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.');else if(e.kind==='auth')alert('로그인 오류입니다. 관리자 비밀번호를 확인해 주세요.');else alert('관리자 로그인 서버 오류입니다. 잠시 후 다시 시도해 주세요.')}}
async function persist(){try{await api('save',S);await load();alert('저장했습니다. 모든 직원에게 공유됩니다.')}catch(e){if(e.kind==='auth'){admin=false;adminPass='';adminBtn.textContent='관리자 로그인';render();alert('로그인 오류입니다. 관리자 인증이 만료되었거나 비밀번호가 일치하지 않습니다. 다시 로그인해 주세요.')}else if(e.kind==='network')alert('네트워크 오류입니다. 인터넷 연결을 확인한 뒤 다시 저장해 주세요.');else alert('DB 저장 오류입니다. 공유 데이터베이스에 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.')}}
function editPerson(i){let p=S.people[i],name=prompt('이름',p.name);if(name===null)return;p.name=name;p.role=prompt('역할',p.role)??p.role;p.down=prompt('출발 일정',p.down)??p.down;p.stay=prompt('숙박 일정',p.stay)??p.stay;p.up=prompt('복귀 일정',p.up)??p.up;p.note=prompt('메모',p.note)??p.note;persist()}
function addPerson(){let name=prompt('이름');if(!name)return;S.people.push({id:'p'+Date.now(),name,role:prompt('역할','전시안내')||'',down:prompt('출발 일정','미정')||'미정',stay:prompt('숙박 일정','미정')||'미정',up:prompt('복귀 일정','미정')||'미정',note:''});persist()}
function editShift(i){let s=S.shifts[i];s.people=prompt('근무자',s.people)??s.people;s.time=prompt('근무시간',s.time)??s.time;s.note=prompt('메모',s.note)??s.note;persist()}
function editTask(i){let t=S.tasks[i];t.title=prompt('준비사항',t.title)??t.title;t.owner=prompt('담당자',t.owner)??t.owner;t.due=prompt('마감일',t.due)??t.due;t.note=prompt('메모',t.note)??t.note;if(confirm('완료 상태로 표시할까요?'))t.done=true;persist()}
async function load(){try{let r=await fetch(SB+'/rest/v1/bixpo_state?id=eq.main&select=data,updated_at',{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});if(!r.ok)throw 0;let j=await r.json();if(j[0])S=j[0].data}catch(e){try{let r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});S=await r.json()}catch(_){}}render()}load();setInterval(load,30000);
</script></body></html>
