<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#282544"><title>안산지사 BIXPO T/F</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f5f6fb;color:#25253b}header{background:#282544;color:white;padding:20px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#c9c7db}.wrap{max-width:1180px;margin:auto;padding:15px}.hero,.card{background:#fff;border:1px solid #e5e6ef;border-radius:16px;padding:16px;margin-bottom:14px}.hero{background:linear-gradient(120deg,#eeeaff,#edf5ff)}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tabs button{border:1px solid #e1e2ea;background:#fff;border-radius:10px;padding:10px 13px;font-weight:700;white-space:nowrap}.tabs .on{background:#6555d9;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:#fff;border:1px solid #e5e6ee;border-radius:13px;padding:13px}.metric b{display:block;font-size:23px;color:#6555d9;margin-top:3px}.muted{font-size:12px;color:#777c90}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{text-align:center;font-size:12px;color:#7a7f91;padding:5px}.day{min-height:150px;background:#fff;border:1px solid #e4e5ed;border-radius:12px;padding:9px}.day.off{opacity:.35}.day.eventday{border-color:#c7bfff}.num{font-weight:800;margin-bottom:6px}.ev{font-size:11px;border-radius:7px;padding:5px 6px;margin:4px 0;line-height:1.35}.depart{background:#e8f3ff;color:#235d8f}.stay{background:#f2ebff;color:#6544a1}.shift{background:#e8f8ef;color:#23734a}.prep{background:#fff1df;color:#8b5b17}.return{background:#ffe9ec;color:#9b3c4a}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.legend span{font-size:11px;padding:5px 8px;border-radius:12px}.item{padding:12px 0;border-top:1px solid #eee}.item:first-of-type{border:0}.badge{background:#efedff;color:#6555d9;border-radius:15px;padding:3px 7px;font-size:11px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.sync{font-size:11px;color:#26714b;background:#e9f8ef;padding:5px 8px;border-radius:15px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.cal{grid-template-columns:1fr}.dow{display:none}.day,.day.off{min-height:auto;opacity:1}.day.off{display:none}.wrap{padding:10px}header h1{font-size:21px}}button.admin{background:#6555d9;color:#fff;border:0;border-radius:9px;padding:9px 12px;font-weight:700}.edit{font-size:11px;border:1px solid #ddd;border-radius:8px;padding:5px 8px;background:#fff}.loginbox{display:flex;gap:6px}.loginbox input{width:150px;padding:8px;border:1px solid #ddd;border-radius:8px}</style></head><body>
<header><div class="row between"><div><h1>안산지사 BIXPO T/F</h1><p>BIXPO 2026 출장 · 숙박 · 전시근무 통합 일정</p></div><div class="row"><span class="sync">● 실시간 공유</span><button class="admin" id="adminBtn" onclick="adminLogin()">관리자 로그인</button></div></div></header><div class="wrap"><div class="hero"><b>BIXPO 2026</b><div class="muted">11월 4일 ~ 6일 · 사전 부스 준비 11월 3일</div></div><div id="metrics" class="grid"></div><div class="tabs" id="tabs"></div><main id="view"></main></div>
<script>
const SB='https://ovaqwpzffawtozgidbav.supabase.co',KEY='sb_publishable_WJNbTVKF66c6Y7AVfxaYBA_7gpkEUyP';let S={people:[],shifts:[],tasks:[],notes:[]},tab='calendar',admin=false,adminPass='';const T=[['calendar','📅 통합 달력'],['people','👥 개인별 일정'],['shifts','🪪 근무표'],['tasks','☑ 준비·시연']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(s){let m=String(s||'').match(/11\/(\d{1,2})/);return m?+m[1]:null}
function stayRange(s){let a=[...String(s||'').matchAll(/11\/(\d{1,2})/g)].map(x=>+x[1]);return a.length>1?[a[0],a[1]]:null}
function events(d){let a=[];S.people.forEach(p=>{if(md(p.down)===d)a.push(['depart','↓ '+p.name+' 출발 · '+p.down.replace(/^.*?오후|^.*?오전/,'').trim()]);if(md(p.up)===d)a.push(['return','↑ '+p.name+' 복귀 · '+p.up]);let r=stayRange(p.stay);if(r&&d>=r[0]&&d<r[1])a.push(['stay','⌂ '+p.name+' 숙박'])});S.shifts.forEach(s=>{if(md(s.date)===d)a.push(['shift','● '+s.period+' '+s.time+' · '+s.people])});if(d===3)a.push(['prep','◆ 부스 준비 · 최재혁, 정승훈']);return a}
function metrics(){let stays=S.people.filter(p=>stayRange(p.stay)).length;return [['참여 인원',S.people.length+'명'],['숙박 확정',stays+'명'],['근무 배정',S.shifts.filter(s=>s.people&&s.people!=='미배정').length+'/'+S.shifts.length],['준비 완료',S.tasks.filter(t=>t.done).length+'/'+S.tasks.length]].map(x=>'<div class="metric"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}
function calendar(){let first=new Date(2026,10,1).getDay(),days=30,h='<div class="card"><div class="row between"><h3>2026년 11월</h3><span class="muted">출발·숙박·근무·복귀를 한 화면에서 확인</span></div><div class="legend"><span class="depart">↓ 출발</span><span class="stay">⌂ 숙박</span><span class="shift">● 전시근무</span><span class="prep">◆ 부스준비</span><span class="return">↑ 복귀</span></div><div class="cal">'+['일','월','화','수','목','금','토'].map(x=>'<div class="dow">'+x+'</div>').join('');for(let i=0;i<first;i++)h+='<div class="day off"></div>';for(let d=1;d<=days;d++){let es=events(d);h+='<div class="day '+(es.length?'eventday':'')+'"><div class="num">'+d+'</div>'+es.map(e=>'<div class="ev '+e[0]+'">'+esc(e[1])+'</div>').join('')+'</div>'}return h+'</div></div>'}
function render(){metricsEl=document.querySelector('#metrics');metricsEl.innerHTML=metrics();document.querySelector('#tabs').innerHTML=T.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>').join('');let h='';
if(tab==='calendar')h=calendar();
if(tab==='people')h='<div class="card"><div class="row between"><h3>개인별 출장 일정</h3>'+(admin?'<button class="admin" onclick="addPerson()">+ 인원 추가</button>':'')+'</div>'+S.people.map((p,i)=>'<div class="item"><div class="row between"><div><b>'+esc(p.name)+'</b> <span class="badge">'+esc(p.role)+'</span></div>'+(admin?'<button class="edit" onclick="editPerson('+i+')">수정</button>':'')+'</div><div>↓ '+esc(p.down)+'</div><div>⌂ '+esc(p.stay)+'</div><div>↑ '+esc(p.up)+'</div>'+(p.note?'<div class="muted">'+esc(p.note)+'</div>':'')+'</div>').join('')+'</div>';
if(tab==='shifts')h='<div class="card"><h3>전시안내 근무표</h3>'+S.shifts.map((s,i)=>'<div class="item row between"><div><b>'+esc(s.date)+' '+esc(s.period)+' '+esc(s.time)+'</b><div>'+esc(s.people)+'</div></div>'+(admin?'<button class="edit" onclick="editShift('+i+')">수정</button>':'')+'</div>').join('')+'</div>';
if(tab==='tasks')h='<div class="card"><h3>준비·시연</h3>'+S.tasks.map((t,i)=>'<div class="item row between"><div><b>'+(t.done?'✓ ':'○ ')+esc(t.title)+'</b><div class="muted">담당 '+esc(t.owner)+' · '+esc(t.due)+'</div><div>'+esc(t.note)+'</div></div>'+(admin?'<button class="edit" onclick="editTask('+i+')">수정</button>':'')+'</div>').join('')+'</div>';
document.querySelector('#view').innerHTML=h}
async function api(action,data){let r=await fetch(SB+'/functions/v1/bixpo-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,password:adminPass,data})});if(!r.ok)throw new Error(r.status);return r.json()}
async function adminLogin(){if(admin){admin=false;adminPass='';adminBtn.textContent='관리자 로그인';render();return}let p=prompt('관리자 비밀번호를 입력하세요.');if(!p)return;adminPass=p;try{await api('login');admin=true;adminBtn.textContent='관리자 로그아웃';render()}catch(e){adminPass='';alert('비밀번호가 맞지 않습니다.')}}
async function persist(){try{await api('save',S);await load();alert('저장했습니다. 모든 직원에게 공유됩니다.')}catch(e){alert('저장에 실패했습니다. 관리자 로그인을 다시 확인해 주세요.')}}
function editPerson(i){let p=S.people[i],name=prompt('이름',p.name);if(name===null)return;p.name=name;p.role=prompt('역할',p.role)??p.role;p.down=prompt('출발 일정',p.down)??p.down;p.stay=prompt('숙박 일정',p.stay)??p.stay;p.up=prompt('복귀 일정',p.up)??p.up;p.note=prompt('메모',p.note)??p.note;persist()}
function addPerson(){let name=prompt('이름');if(!name)return;S.people.push({id:'p'+Date.now(),name,role:prompt('역할','전시안내')||'',down:prompt('출발 일정','미정')||'미정',stay:prompt('숙박 일정','미정')||'미정',up:prompt('복귀 일정','미정')||'미정',note:''});persist()}
function editShift(i){let s=S.shifts[i];s.people=prompt('근무자',s.people)??s.people;s.time=prompt('근무시간',s.time)??s.time;s.note=prompt('메모',s.note)??s.note;persist()}
function editTask(i){let t=S.tasks[i];t.title=prompt('준비사항',t.title)??t.title;t.owner=prompt('담당자',t.owner)??t.owner;t.due=prompt('마감일',t.due)??t.due;t.note=prompt('메모',t.note)??t.note;if(confirm('완료 상태로 표시할까요?'))t.done=true;persist()}
async function load(){try{let r=await fetch(SB+'/rest/v1/bixpo_state?id=eq.main&select=data,updated_at',{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});if(!r.ok)throw 0;let j=await r.json();if(j[0])S=j[0].data}catch(e){try{let r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});S=await r.json()}catch(_){}}render()}load();setInterval(load,30000);
</script></body></html>
