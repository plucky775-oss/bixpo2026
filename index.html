<script>
const SB='https://ovaqwpzffawtozgidbav.supabase.co',KEY='sb_publishable_WJNbTVKF66c6Y7AVfxaYBA_7gpkEUyP';let S={people:[],shifts:[],tasks:[],notes:[]},FAQ=[],tab='calendar',admin=false,adminPass='',personFilter='전체',typeFilter='전체',faqProduct='전체',faqQuery='',openFaq=new Set(),staff=null,staffToken=localStorage.getItem('bixpo_staff_token')||'',CHAT=[];const T=[['calendar','📅 통합 달력'],['people','👥 개인별 일정'],['shifts','🪪 근무표'],['tasks','☑ 준비·시연'],['faq','💬 전시 FAQ'],['chat','💬 T/F 채팅'],['adminpanel','⚙️ 관리자']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(s){let m=String(s||'').match(/11\/(\d{1,2})/);return m?+m[1]:null}
function stayRange(s){let a=[...String(s||'').matchAll(/11\/(\d{1,2})/g)].map(x=>+x[1]);return a.length>1?[a[0],a[1]]:null}
function selected(name){return personFilter==='전체'||String(name||'').replaceAll(' ','').split(',').includes(personFilter)}
function typed(t){return typeFilter==='전체'||typeFilter===t||(typeFilter==='travel'&&(t==='depart'||t==='return'))}
function events(d){let a=[];S.people.forEach(p=>{if(!selected(p.name))return;if(typed('depart')&&md(p.down)===d)a.push(['depart','↓ '+p.name+' 출발 · '+p.down]);if(typed('return')&&md(p.up)===d)a.push(['return','↑ '+p.name+' 복귀 · '+p.up]);let r=stayRange(p.stay);if(typed('stay')&&r&&d>=r[0]&&d<r[1])a.push(['stay','⌂ '+p.name+' 숙박'])});S.shifts.forEach(s=>{let names=String(s.people||'').replaceAll(' ','').split(',');if(typed('shift')&&md(s.date)===d&&(personFilter==='전체'||names.includes(personFilter)))a.push(['shift','● '+s.period+' '+s.time+' · '+s.people])});if(typed('prep')&&d===3&&(personFilter==='전체'||['최재혁','정승훈'].includes(personFilter)))a.push(['prep','◆ 부스 준비 · 최재혁, 정승훈']);if(typed('prep')&&d===6&&(personFilter==='전체'||['최재혁','신소망'].includes(personFilter)))a.push(['prep','◆ 부스 철거 · 최재혁, 신소망']);return a}
function metrics(){let stays=S.people.filter(p=>stayRange(p.stay)).length;return [['참여 인원',S.people.length+'명'],['숙박 확정',stays+'명'],['근무 배정',S.shifts.filter(s=>s.people&&s.people!=='미배정').length+'/'+S.shifts.length],['준비 완료',S.tasks.filter(t=>t.done).length+'/'+S.tasks.length]].map(x=>'<div class="metric"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}
function calendar(){let h='<div class="card"><div class="row between"><h3>2026년 11월 1주차</h3><span class="muted">11월 2일(월) ~ 6일(금)</span></div><div class="filter"><b>내 일정 보기</b><select onchange="personFilter=this.value;render()"><option>전체</option>'+S.people.map(p=>'<option '+(personFilter===p.name?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select><b>일정 종류</b><select onchange="typeFilter=this.value;render()"><option value="전체">전체</option><option value="travel" '+(typeFilter==='travel'?'selected':'')+'>출발·복귀</option><option value="stay" '+(typeFilter==='stay'?'selected':'')+'>숙박</option><option value="shift" '+(typeFilter==='shift'?'selected':'')+'>전시근무</option><option value="prep" '+(typeFilter==='prep'?'selected':'')+'>부스준비</option></select><span class="muted">이름과 일정 종류를 함께 선택할 수 있습니다.</span></div><div class="legend"><span class="depart">↓ 출발</span><span class="stay">⌂ 숙박</span><span class="shift">● 전시근무</span><span class="prep">◆ 부스준비</span><span class="return">↑ 복귀</span></div><div class="cal">'+['2 월','3 화','4 수','5 목','6 금'].map((x,i)=>{let d=i+2,es=events(d),order=['depart','stay','shift','prep','return'];es.sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));return '<div class="day '+(es.length?'eventday':'')+'"><div class="num">'+x+'</div>'+order.map(type=>{let rows=es.filter(e=>e[0]===type);return rows.length?'<div class="daygroup '+type+'">'+rows.map(e=>'<div class="ev '+type+'">'+esc(e[1])+'</div>').join('')+'</div>':''}).join('')+'</div>'}).join('')+'</div></div>';return h}
function renderHotel(){let h=S.hotel;if(!h){document.querySelector('#hotelArea').innerHTML='';return}let stays=S.people.filter(p=>stayRange(p.stay)).map(p=>'<div><b>'+esc(p.name)+'</b> · '+esc(p.stay)+'</div>').join('');document.querySelector('#hotelArea').innerHTML='<div class="hotel"><div class="row between"><div><h3>🏨 숙소정보</h3><b>'+esc(h.name)+'</b> <span class="badge">'+esc(h.status||'')+'</span><div class="muted" style="margin-top:4px">'+esc(h.note||'')+'</div></div><a class="hotelbtn" href="'+esc(h.booking_url||'#')+'" target="_blank" rel="noopener">숙소 상세보기</a></div><div style="margin-top:10px">'+stays+'</div></div>'}
function renderNotice(){let ns=S.notes||[],h='';if(ns.length)h='<div class="notice-list">'+ns.map((n,i)=>'<div class="notice-row"><h3>📢 '+esc(n.title||'공지사항')+'</h3><p>'+esc(n.text||'')+'</p><div class="notice-meta">'+esc(n.date||'')+'</div>'+(admin?'<div class="notice-actions row"><button class="edit" onclick="editNotice('+i+')">수정</button><button class="edit" onclick="deleteNotice('+i+')">삭제</button></div>':'')+'</div>').join('')+'</div>';if(admin)h+='<div class="notice-actions"><button class="admin" onclick="addNotice()">+ 공지사항 등록</button></div>';document.querySelector('#noticeArea').innerHTML=h}
function announceNotice(n){try{let seen=JSON.parse(localStorage.getItem('bixpo_seen_notices')||'[]');if(seen.includes(n.id))return;localStorage.setItem('bixpo_seen_notices',JSON.stringify([...seen,n.id].slice(-50)));if('Notification'in window&&Notification.permission==='granted')new Notification(n.title||'BIXPO T/F 새 공지',{body:n.text||''});let A=window.AudioContext||window.webkitAudioContext;if(A){let ac=new A(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.45);o.start();o.stop(ac.currentTime+.45)}}catch(e){}}
function checkNewNotices(before){let old=new Set((before||[]).map(n=>n.id));(S.notes||[]).forEach(n=>{if(!old.has(n.id))announceNotice(n)})}
async function addNotice(){let title=prompt('공지 제목','공지사항');if(title===null)return;let text=prompt('공지 내용을 입력하세요.','');if(text===null||!text.trim())return;if(!S.notes)S.notes=[];let n={id:'notice-'+Date.now(),title:title||'공지사항',text,date:new Date().toLocaleString('ko-KR')};S.notes.unshift(n);let ok=await persist();if(ok){announceNotice(n);try{let r=await pushApi({action:'notify',password:adminPass,title:'안산지사 BIXPO 성공기원 T/F · '+n.title,body:n.text});if(r.sent!==undefined)alert('푸시 알림을 '+r.sent+'대 기기에 발송했습니다.')}catch(e){alert(e.kind==='auth'?'공지는 저장됐지만 푸시 인증에 실패했습니다.':'공지는 저장됐지만 푸시 발송에 실패했습니다.')}}}
function editNotice(i){let n=S.notes[i],title=prompt('공지 제목',n.title||'공지사항');if(title===null)return;let text=prompt('공지 내용',n.text||'');if(text===null)return;if(!text.trim())return;Object.assign(n,{title:title||'공지사항',text,date:new Date().toLocaleString('ko-KR')});persist()}
function deleteNotice(i){if(!confirm('이 공지사항을 삭제할까요?'))return;S.notes.splice(i,1);persist()}
async function staffApi(body){let r=await fetch(SB+'/functions/v1/bixpo-staff',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)}),j={};try{j=await r.json()}catch(_){}if(!r.ok)throw new Error(j.error||'staff');return j}
async function restoreStaff(){if(!staffToken)return;try{let j=await staffApi({action:'me',token:staffToken});staff={name:j.name,role:j.role};applyStaff()}catch(e){localStorage.removeItem('bixpo_staff_token');staffToken=''}}

async function staffLogin(){if(staff){try{await staffApi({action:'logout',token:staffToken})}catch(_){}staff=null;staffToken='';localStorage.removeItem('bixpo_staff_token');admin=false;adminBtn.style.display='';staffBtn.textContent='👤 직원 로그인';personFilter='전체';render();return}let box=document.createElement('div');box.id='staffLoginModal';box.style.cssText='position:fixed;inset:0;background:#0008;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';box.innerHTML='<div style="background:white;border-radius:16px;padding:20px;width:min(420px,100%)"><h3 style="margin-top:0">👤 직원 로그인</h3><label>이름 선택<select id="staffNameSelect" style="width:100%;padding:11px;margin:7px 0 12px;border:1px solid #ddd;border-radius:9px"><option value="">본인 이름을 선택하세요</option>'+S.people.map(p=>'<option value="'+esc(p.name)+'">'+esc(p.name)+(p.name==='최재혁'?' · 관리자':'')+'</option>').join('')+'</select></label><label>PIN 4자리<input id="staffPinInput" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="••••" style="width:100%;padding:11px;margin:7px 0 15px;border:1px solid #ddd;border-radius:9px;font-size:20px;letter-spacing:6px"></label><div class="row" style="justify-content:flex-end"><button class="edit" onclick="document.getElementById(\'staffLoginModal\').remove()">취소</button><button class="admin" id="staffLoginGo">로그인</button></div></div>';document.body.appendChild(box);document.getElementById('staffLoginGo').onclick=async()=>{let name=document.getElementById('staffNameSelect').value,pin=document.getElementById('staffPinInput').value;if(!name){alert('본인 이름을 선택해 주세요.');return}if(!/^\d{4}$/.test(pin)){alert('PIN 숫자 4자리를 입력해 주세요.');return}try{let j=await staffApi({action:'login',name,pin});box.remove();staffToken=j.token;localStorage.setItem('bixpo_staff_token',staffToken);staff={name:j.name,role:j.role};applyStaff()}catch(e){alert(e.message==='pin_not_set'?'아직 PIN이 설정되지 않았습니다. 관리자에게 문의하세요.':'이름 또는 PIN이 맞지 않습니다.')}}}
async function loadChat(){if(!staffToken)return;try{let j=await staffApi({action:'chat_list',token:staffToken}),next=j.messages||[];let oldIds=new Set(CHAT.map(m=>m.id)),fresh=next.filter(m=>!oldIds.has(m.id)&&m.staff_name!==staff?.name);let changed=JSON.stringify(next)!==JSON.stringify(CHAT);CHAT=next;if(tab==='chat'&&changed)renderChatMessages();if(oldIds.size&&fresh.length)fresh.forEach(m=>notifyChat(m))}catch(_){}}
function notifyChat(m){try{let title=m.staff_name+' · 새 채팅',body=m.message||'';if('Notification'in window&&Notification.permission==='granted'&&document.visibilityState!=='visible')new Notification(title,{body,icon:'/icon.svg'});if(document.visibilityState==='visible'){let A=window.AudioContext||window.webkitAudioContext;if(A){let ac=new A(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=740;g.gain.setValueAtTime(.09,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);o.start();o.stop(ac.currentTime+.25)}}}catch(e){}}
function renderChatMessages(){let box=document.getElementById('chatbox');if(!box)return;let nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.innerHTML=CHAT.map(m=>'<div class="msg '+(m.staff_name===staff?.name?'me':'')+'"><div class="msghead"><b>'+esc(m.staff_name)+'</b> · '+new Date(m.created_at).toLocaleString('ko-KR')+(staff?.role==='admin'?' <button class="edit" onclick="deleteChat('+m.id+')">삭제</button>':'')+'</div>'+esc(m.message)+'</div>').join('');if(nearBottom)box.scrollTop=box.scrollHeight}
function chatView(){if(!staff)return '<div class="card"><h3>💬 T/F 채팅</h3><p>직원별 PIN으로 로그인하면 팀 채팅을 사용할 수 있습니다.</p><button class="admin" onclick="staffLogin()">직원 로그인</button></div>';return '<div class="card"><div class="row between"><div><h3>💬 T/F 채팅</h3><div class="muted">'+esc(staff.name)+' 이름으로 메시지가 등록됩니다.</div></div></div><div class="chatbox" id="chatbox">'+CHAT.map(m=>'<div class="msg '+(m.staff_name===staff.name?'me':'')+'"><div class="msghead"><b>'+esc(m.staff_name)+'</b> · '+new Date(m.created_at).toLocaleString('ko-KR')+(staff.role==='admin'?' <button class="edit" onclick="deleteChat('+m.id+')">삭제</button>':'')+'</div>'+esc(m.message)+'</div>').join('')+'</div><div class="chatinput"><input id="chatText" maxlength="1000" placeholder="메시지 입력" onkeydown="if(event.key===\'Enter\')sendChat()"><button class="admin" onclick="sendChat()">전송</button></div></div>'}
async function sendChat(){let e=document.getElementById('chatText'),m=e?.value.trim();if(!m)return;try{await staffApi({action:'chat_send',token:staffToken,message:m});e.value='';await loadChat();e=document.getElementById('chatText');if(e)e.focus()}catch(_){alert('메시지 전송에 실패했습니다.')}}
async function deleteChat(id){if(!confirm('이 메시지를 삭제할까요?'))return;try{await staffApi({action:'chat_delete',token:staffToken,id});await loadChat()}catch(_){alert('삭제할 수 없습니다.')}}
async function adminSetPin(name){let pin=prompt(name+'의 새 PIN 4자리를 입력하세요.');if(!pin)return;if(!/^\d{4}$/.test(pin)){alert('PIN은 숫자 4자리로 입력해 주세요.');return}try{await staffApi({action:'set_pin',token:staffToken,name,pin});alert(name+' PIN을 설정했습니다. 기존 로그인 세션은 해제됩니다.')}catch(_){alert('PIN 설정에 실패했습니다.')}}
function staffManage(){if(!staff||staff.role!=='admin')return '';return '<div class="card"><h3>⚙️ 직원 PIN 관리</h3>'+S.people.map(p=>'<div class="item row between"><b>'+esc(p.name)+(p.name==='최재혁'?' <span class="badge">관리자</span>':'')+'</b><button class="edit" onclick="adminSetPin(\''+esc(p.name)+'\')">PIN 설정/재설정</button></div>').join('')+'</div>'}function adminPanel(){if(!admin)return '<div class="card"><h3>⚙️ 관리자</h3><p>관리자 로그인이 필요합니다.</p></div>';let rows=S.people.map(p=>'<div class="item row between"><div><b>'+esc(p.name)+'</b>'+(p.name==='최재혁'?' <span class="badge">관리자</span>':' <span class="muted">직원</span>')+'</div><div class="row"><button class="edit" onclick="setPinFromAdmin(\''+esc(p.name)+'\')">PIN 설정/재설정</button><button class="edit" onclick="revokeFromAdmin(\''+esc(p.name)+'\')">강제 로그아웃</button></div></div>').join('');return '<div class="card"><h3>⚙️ 관리자 화면</h3><div class="muted">직원 로그인과 권한을 관리합니다. 최재혁은 직원 PIN 로그인 시 관리자 권한이 활성화됩니다.</div>'+rows+'</div><div class="card"><h3>관리 기능</h3><div class="item">📅 일정·숙박·근무표 — 각 메뉴에서 수정</div><div class="item">☑ 준비·시연 — 추가·수정·삭제</div><div class="item">📢 공지사항 — 등록·수정·삭제 및 Push 발송</div><div class="item">💬 전시 FAQ — 추가·수정·삭제</div><div class="item">💬 T/F 채팅 — 최재혁 관리자 로그인 시 전체 메시지 관리</div></div>'}
async function adminStaffApi(action,name,pin){let r=await fetch(SB+'/functions/v1/bixpo-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,password:adminPass,name,pin})});let j={};try{j=await r.json()}catch(_){}if(!r.ok)throw new Error(j.error||'admin');return j}
async function setPinFromAdmin(name){let pin=prompt(name+'의 새 PIN 4자리를 입력하세요.');if(!pin)return;if(!/^\d{4}$/.test(pin)){alert('PIN은 숫자 4자리로 입력해 주세요.');return}try{await adminStaffApi('set_staff_pin',name,pin);alert(name+'의 PIN을 설정했습니다. 기존 직원 로그인 세션은 해제됩니다.')}catch(e){alert('PIN 설정에 실패했습니다.')}}
async function revokeFromAdmin(name){if(!confirm(name+'의 로그인된 모든 기기를 로그아웃할까요?'))return;try{await adminStaffApi('revoke_staff',name);alert(name+'의 기존 로그인 세션을 해제했습니다.')}catch(e){alert('강제 로그아웃에 실패했습니다.')}}

async function loadFAQ(){try{let r=await fetch(SB+'/rest/v1/bixpo_faq?select=*&order=sort_order.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});if(r.ok)FAQ=await r.json()}catch(e){}if(tab==='faq')render()}
function faqMatch(x){let q=faqQuery.trim().toLowerCase();return (faqProduct==='전체'||x.product===faqProduct)&&(!q||[x.question,x.short_answer,x.detail,x.category,x.product].join(' ').toLowerCase().includes(q))}
function faqView(){let list=FAQ.filter(faqMatch);return '<div class="card"><div class="row between"><div><h3>💬 BIXPO 전시 FAQ</h3><div class="muted">관람객 질문의 핵심어를 검색하세요 · <span id="faqCount">'+list.length+'</span>개 결과</div></div>'+(admin?'<button class="admin" onclick="addFAQ()">+ FAQ 추가</button>':'')+'</div><input id="faqSearch" class="faq-search" placeholder="예: 사고사진, AI, 서명, 영상, 케이블…" value="'+esc(faqQuery)+'" oninput="filterFAQInPlace(this.value)"><div class="faqfilters">'+['전체','Power TBM','Safety 4-Cut','공통'].map(x=>'<button class="'+(faqProduct===x?'on':'')+'" onclick="faqProduct=\''+x+'\';render()">'+x+'</button>').join('')+'</div>'+list.map((x,i)=>'<div class="faqitem '+(openFaq.has(x.id)?'open':'')+'" id="faq'+x.id+'" data-faq-id="'+x.id+'"><div class="faq-q" onclick="toggleFAQ('+x.id+')"><span class="producttag">'+esc(x.product)+'</span><span class="producttag">'+esc(x.category)+'</span> '+esc(x.question)+'</div><div class="faq-a"><div class="faq-short">10초 답변 · '+esc(x.short_answer)+'</div><div class="faq-detail">'+esc(x.detail)+'</div>'+(admin?'<div class="row" style="margin-top:10px"><button class="edit" onclick="event.stopPropagation();editFAQ('+x.id+')">수정</button><button class="edit" onclick="event.stopPropagation();deleteFAQ('+x.id+')">삭제</button></div>':'')+'</div></div>').join('')+'</div>'}
function toggleFAQ(id){if(openFaq.has(id))openFaq.delete(id);else openFaq.add(id);let el=document.getElementById('faq'+id);if(el)el.classList.toggle('open',openFaq.has(id))}
function filterFAQInPlace(v){faqQuery=v;let q=v.trim().toLowerCase(),count=0;document.querySelectorAll('.faqitem').forEach(el=>{let x=FAQ.find(f=>String(f.id)===String(el.dataset.faqId));let ok=x&&(faqProduct==='전체'||x.product===faqProduct)&&(!q||[x.question,x.short_answer,x.detail,x.category,x.product].join(' ').toLowerCase().includes(q));el.style.display=ok?'':'none';if(ok)count++});let n=document.getElementById('faqCount');if(n)n.textContent=count}
async function faqAdmin(action,payload){let r=await fetch(SB+'/functions/v1/bixpo-faq-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,password:adminPass,...payload})});if(r.status===401)throw new Error('auth');if(!r.ok)throw new Error('save')}
async function addFAQ(){let product=prompt('제품 구분: Power TBM / Safety 4-Cut / 공통','Power TBM');if(!product)return;let category=prompt('분류','현장질문');if(!category)return;let question=prompt('질문');if(!question)return;let short_answer=prompt('10초 답변');if(!short_answer)return;let detail=prompt('자세한 설명','')??'';try{await faqAdmin('add',{item:{product,category,question,short_answer,detail}});await loadFAQ();alert('FAQ를 추가했습니다.')}catch(e){alert(e.message==='auth'?'관리자 인증 오류입니다.':'FAQ 저장에 실패했습니다.')}}
async function editFAQ(id){let x=FAQ.find(v=>v.id===id);if(!x)return;let product=prompt('제품 구분',x.product);if(product===null)return;let category=prompt('분류',x.category);if(category===null)return;let question=prompt('질문',x.question);if(question===null)return;let short_answer=prompt('10초 답변',x.short_answer);if(short_answer===null)return;let detail=prompt('자세한 설명',x.detail||'');if(detail===null)return;try{await faqAdmin('update',{item:{...x,product,category,question,short_answer,detail}});await loadFAQ();alert('FAQ를 수정했습니다.')}catch(e){alert('FAQ 수정에 실패했습니다.')}}
async function deleteFAQ(id){if(!confirm('이 FAQ를 삭제할까요?'))return;try{await faqAdmin('delete',{id});await loadFAQ()}catch(e){alert('FAQ 삭제에 실패했습니다.')}}
function render(){renderNotice();renderHotel();let tabs=admin?T:T.filter(x=>!['adminpanel','people','shifts'].includes(x[0]));if(!admin&&['people','shifts','adminpanel'].includes(tab))tab='calendar';metricsEl=document.querySelector('#metrics');metricsEl.innerHTML=metrics();document.querySelector('#tabs').innerHTML=tabs.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>').join('');let h='';
if(tab==='calendar')h=calendar();
if(tab==='people')h='<div class="card"><div class="row between"><h3>개인별 출장 일정</h3>'+(admin?'<button class="admin" onclick="addPerson()">+ 인원 추가</button>':'')+'</div>'+S.people.map((p,i)=>'<div class="item"><div class="row between"><div><b>'+esc(p.name)+'</b> <span class="badge">'+esc(p.role)+'</span></div>'+(admin?'<button class="edit" onclick="editPerson('+i+')">수정</button>':'')+'</div><div>↓ '+esc(p.down)+'</div><div>⌂ '+esc(p.stay)+'</div><div>↑ '+esc(p.up)+'</div>'+(p.note?'<div class="muted">'+esc(p.note)+'</div>':'')+'</div>').join('')+'</div>';
if(tab==='shifts')h='<div class="card"><h3>전시안내 근무표</h3>'+S.shifts.map((s,i)=>'<div class="item row between"><div><b>'+esc(s.date)+' '+esc(s.period)+' '+esc(s.time)+'</b><div>'+esc(s.people)+'</div></div>'+(admin?'<button class="edit" onclick="editShift('+i+')">수정</button>':'')+'</div>').join('')+'</div>';
if(tab==='faq')h=faqView();
if(tab==='chat')h=chatView();
if(tab==='adminpanel')h=adminPanel();
if(tab==='tasks')h='<div class="card"><div class="row between"><h3>준비·시연</h3>'+(admin?'<button class="admin" onclick="addTask()">+ 준비·시연 추가</button>':'')+'</div>'+S.tasks.map((t,i)=>'<div class="item row between"><div><b>'+(t.done?'✓ ':'○ ')+esc(t.title)+'</b><div class="muted">담당자 '+esc(t.owner||'미정')+' · 마감 '+esc(t.due||'미정')+'</div><div>'+esc(t.note||'')+'</div></div>'+(admin?'<div class="row"><button class="edit" onclick="editTask('+i+')">수정</button><button class="edit" onclick="deleteTask('+i+')">삭제</button></div>':'')+'</div>').join('')+'</div>';
document.querySelector('#view').innerHTML=h}
async function api(action,data){let r;try{r=await fetch(SB+'/functions/v1/bixpo-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,password:adminPass,data})})}catch(e){let x=new Error('network');x.kind='network';throw x}let body={};try{body=await r.json()}catch(e){}if(r.status===401||r.status===403){let x=new Error('auth');x.kind='auth';throw x}if(!r.ok){let x=new Error(body.detail||body.error||('HTTP '+r.status));x.kind='db';x.status=r.status;throw x}return body}
async function adminLogin(){if(admin){admin=false;adminPass='';adminBtn.textContent='관리자 로그인';render();return}let p=prompt('관리자 비밀번호를 입력하세요.');if(!p)return;adminPass=p;try{await api('login');admin=true;adminBtn.textContent='관리자 로그아웃';render()}catch(e){adminPass='';if(e.kind==='network')alert('네트워크 오류입니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.');else if(e.kind==='auth')alert('로그인 오류입니다. 관리자 비밀번호를 확인해 주세요.');else alert('관리자 로그인 서버 오류입니다. 잠시 후 다시 시도해 주세요.')}}
async function persist(){try{await api('save',S);await load();alert('저장했습니다. 모든 직원에게 공유됩니다.');return true}catch(e){if(e.kind==='auth'){admin=false;adminPass='';adminBtn.textContent='관리자 로그인';render();alert('로그인 오류입니다. 관리자 인증이 만료되었거나 비밀번호가 일치하지 않습니다. 다시 로그인해 주세요.')}else if(e.kind==='network')alert('네트워크 오류입니다. 인터넷 연결을 확인한 뒤 다시 저장해 주세요.');else alert('DB 저장 오류입니다. 공유 데이터베이스에 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.');return false}}
function editPerson(i){let p=S.people[i],name=prompt('이름',p.name);if(name===null)return;p.name=name;p.role=prompt('역할',p.role)??p.role;p.down=prompt('출발 일정',p.down)??p.down;p.stay=prompt('숙박 일정',p.stay)??p.stay;p.up=prompt('복귀 일정',p.up)??p.up;p.note=prompt('메모',p.note)??p.note;persist()}
function addPerson(){let name=prompt('이름');if(!name)return;S.people.push({id:'p'+Date.now(),name,role:prompt('역할','전시안내')||'',down:prompt('출발 일정','미정')||'미정',stay:prompt('숙박 일정','미정')||'미정',up:prompt('복귀 일정','미정')||'미정',note:''});persist()}
function editShift(i){let s=S.shifts[i];s.people=prompt('근무자',s.people)??s.people;s.time=prompt('근무시간',s.time)??s.time;s.note=prompt('메모',s.note)??s.note;persist()}
function addTask(){let title=prompt('준비·시연 항목을 입력하세요.');if(!title)return;let owner=prompt('담당자를 입력하세요.','미정');if(owner===null)return;let due=prompt('마감일을 입력하세요.','11/3(화)');if(due===null)return;let note=prompt('메모를 입력하세요.','')??'';S.tasks.push({id:'t'+Date.now(),title,owner:owner||'미정',due:due||'미정',note,done:false});persist()}
function editTask(i){let t=S.tasks[i];let title=prompt('준비·시연 항목',t.title);if(title===null)return;let owner=prompt('담당자',t.owner||'미정');if(owner===null)return;let due=prompt('마감일',t.due||'미정');if(due===null)return;let note=prompt('메모',t.note||'');if(note===null)return;let done=confirm('완료된 항목이면 확인을 누르세요.\n취소를 누르면 미완료로 표시됩니다.');Object.assign(t,{title,owner:owner||'미정',due:due||'미정',note,done});persist()}
function deleteTask(i){let t=S.tasks[i];if(!confirm('「'+t.title+'」 항목을 삭제할까요?'))return;S.tasks.splice(i,1);persist()}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
window.addEventListener('appinstalled',()=>{if(installBtn)installBtn.textContent='✓ 앱 설치됨'});
function standalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
async function installPWA(){if(standalone()){alert('이미 홈 화면 앱으로 실행 중입니다.');return}if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;return}let ios=/iPhone|iPad|iPod/.test(navigator.userAgent);if(ios)alert('iPhone/iPad: 공유 버튼(□↑) → 홈 화면에 추가 → 추가한 BIXPO T/F 앱을 실행하세요.\n홈 화면 앱에서 푸시 알림을 받을 수 있습니다.');else alert('브라우저 메뉴에서 “앱 설치” 또는 “홈 화면에 추가”를 선택해 주세요.')}
function b64(s){let p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(b),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a}
async function pushApi(body){let r;try{r=await fetch(SB+'/functions/v1/bixpo-push',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)})}catch(e){let x=new Error('network');x.kind='network';throw x}let j={};try{j=await r.json()}catch(_){}if(r.status===401||r.status===403){let x=new Error('auth');x.kind='auth';throw x}if(!r.ok){let x=new Error(j.error||'push');x.kind='push';throw x}return j}
async function enablePush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){alert('이 기기/브라우저는 Web Push 알림을 지원하지 않습니다.');return}let ios=/iPhone|iPad|iPod/.test(navigator.userAgent);if(ios&&!standalone()){alert('iPhone/iPad에서는 먼저 이 앱을 홈 화면에 추가한 뒤, 홈 화면의 BIXPO T/F 앱을 열어 🔔 알림 받기를 눌러주세요.');return}let perm=await Notification.requestPermission();if(perm!=='granted'){alert('알림 권한이 허용되지 않았습니다. 기기 설정에서 알림을 허용해 주세요.');return}let reg=await navigator.serviceWorker.ready,key=await pushApi({action:'key'}),sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key.publicKey)});await pushApi({action:'subscribe',subscription:sub.toJSON()});pushBtn.textContent='🔔 알림 등록됨';alert('푸시 알림 등록이 완료되었습니다. 앱을 닫아도 새 공지 알림을 받을 수 있습니다.')}catch(e){alert(e.kind==='network'?'네트워크 오류로 알림 등록에 실패했습니다.':'푸시 알림 등록에 실패했습니다. 잠시 후 다시 시도해 주세요.')}}
loadFAQ();restoreStaff();setInterval(loadChat,5000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').then(async()=>{try{let r=await navigator.serviceWorker.ready,s=await r.pushManager.getSubscription();if(s&&pushBtn)pushBtn.textContent='🔔 알림 등록됨'}catch(_){}});
async function load(){let before=[...(S.notes||[])],oldState=JSON.stringify(S);try{let r=await fetch(SB+'/rest/v1/bixpo_state?id=eq.main&select=data,updated_at',{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});if(!r.ok)throw 0;let j=await r.json();if(j[0])S=j[0].data}catch(e){try{let r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});S=await r.json()}catch(_){}}let changed=oldState!==JSON.stringify(S);if(tab==='chat'){renderNotice();renderHotel();document.querySelector('#metrics').innerHTML=metrics()}else if(changed||!document.querySelector('#view').innerHTML)render();if(before.length)checkNewNotices(before)}load();setInterval(load,15000);
</script></body></html>
